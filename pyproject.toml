[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imste"
version = "0.1.0"
description = "Iterated Minimum Spanning Tree Embedding (IMSTE)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "scikit-learn>=1.2",
    "numba>=0.58",
    "torch>=2.0",
    "joblib>=1.3",
    "pynndescent>=0.5.13",
    "rinnd>=0.3.1",
    "igraph>=0.11",
    "leidenalg>=0.10",
]

[project.optional-dependencies]
test = ["pytest>=7"]
notebook = ["matplotlib>=3.7", "pandas>=2.0", "umap-learn>=0.6.0", "plotly>=5.18", "ipywidgets>=8", "psutil>=5.9", "datashader>=0.15", "tqdm>=4.65", "rinnd>=0.3.1", "yt>=4.4"]
famst = ["pynndescent>=0.5.13"]
rinnd = ["rinnd>=0.3.1"]

[tool.setuptools.packages.find]
include = ["imste*"]
