[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "imste"
version = "0.8.3"
description = "Iterated Minimum Spanning Tree Embedding (IMSTE)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Fabrizio Costa" }]
keywords = ["embedding", "dimensionality-reduction", "minimum-spanning-tree", "manifold-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "scikit-learn>=1.2",
    "numba>=0.58",
    "joblib>=1.3",
    "pynndescent>=0.5.13",
    "rinnd>=0.3.1",
    "igraph>=0.11",
    "leidenalg>=0.10",
]

[project.urls]
Homepage = "https://github.com/fabriziocosta/IteratedMinimumSpanningTree"
Repository = "https://github.com/fabriziocosta/IteratedMinimumSpanningTree"
Issues = "https://github.com/fabriziocosta/IteratedMinimumSpanningTree/issues"
Documentation = "https://imste.readthedocs.io/"

[project.optional-dependencies]
gpu = ["torch>=2.0"]
test = ["pytest>=7", "pandas>=2.0", "torch>=2.0", "matplotlib>=3.7"]
notebook = [
    "matplotlib>=3.7",
    "pandas>=2.0",
    "umap-learn>=0.6.0",
    "plotly>=5.18",
    "ipywidgets>=8",
    "psutil>=5.9",
    "datashader>=0.15",
    "tqdm>=4.65",
    "yt>=4.4",
]
tuning = ["scikit-optimize>=0.10.2"]
preprocessing = [
    "sentence-transformers[image]>=6.3",
]

[tool.setuptools.packages.find]
include = ["imste*"]
